<ion-header class="ion-no-border">
    <ion-toolbar style="--background: #00A859; --color: #ffffff;">
        <ion-buttons slot="start">
            <ion-button (click)="regresar()" style="--color: #ffffff;">
                <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Gestión de Almacenes</ion-title>
    </ion-toolbar>
</ion-header>

<!-- Botón compacto para abrir la lista -->
<div class="btn-container">
    <ion-button fill="outline" class="btn-compact" (click)="abrirModalAlmacenes()">
        <ion-icon name="list-outline" slot="start"></ion-icon>
        Ver Lista
    </ion-button>
</div>

<ion-content class="ion-padding bg-light">

    <!-- Formulario de Registro -->
    <ion-card class="custom-card">
        <ion-card-content>
            <h3 class="card-title">Nuevo Almacén / Sede</h3>

            <div class="form-container">
                <ion-item fill="outline" class="form-item custom-input">
                    <ion-label position="stacked">Nombre del Almacén</ion-label>
                    <ion-input [(ngModel)]="nuevoAlmacen.nombre" placeholder="Ej: Planta Huamachuco"></ion-input>
                </ion-item>

                <ion-item fill="outline" class="form-item custom-input">
                    <ion-label position="stacked">Ubicación / Dirección</ion-label>
                    <ion-input [(ngModel)]="nuevoAlmacen.ubicacion" placeholder="Ej: Av. Balta 123"></ion-input>
                </ion-item>

                <ion-button expand="block" class="btn-guardar" (click)="guardarAlmacen()" [disabled]="cargando">
                    <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
                    <span *ngIf="!cargando">
                        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
                        Registrar Almacén
                    </span>
                </ion-button>


            </div>
        </ion-card-content>
    </ion-card>

    <ion-modal [isOpen]="modalAbierto" (didDismiss)="modalAbierto = false" [initialBreakpoint]="0.75"
        [breakpoints]="[0, 0.75, 0.95]">
        <ng-template>
            <ion-header class="ion-no-border">
                <ion-toolbar style="--background: #ffffff; --color: #0f172a; padding: 0 8px;">
                    <ion-title style="font-size: 16px; font-weight: 700;">Almacenes ({{ listaAlmacenes.length
                        }})</ion-title>
                    <ion-buttons slot="end">
                        <ion-button color="medium" (click)="modalAbierto = false"
                            style="font-weight: 600;">Cerrar</ion-button>
                    </ion-buttons>
                </ion-toolbar>
            </ion-header>

            <ion-content class="modal-content ion-padding">
                <div *ngIf="cargandoLista" class="ion-text-center ion-padding">
                    <ion-spinner name="crescent" color="success"></ion-spinner>
                </div>

                <div class="almacen-card" *ngFor="let almacen of listaAlmacenes">
                    <div class="almacen-icon">
                        <ion-icon name="business-outline"></ion-icon>
                    </div>
                    <div class="almacen-info">
                        <h4>{{ almacen.nombre }}</h4>
                        <p>
                            <ion-icon name="location-outline"></ion-icon>
                            {{ almacen.ubicacion || 'Sin ubicación registrada' }}
                        </p>
                    </div>

                    <!-- Acciones -->
                    <div class="acciones-card">
                        <ion-button fill="clear" class="btn-editar" (click)="prepararEdicion(almacen)">
                            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                        </ion-button>
                        <ion-button fill="clear" class="btn-eliminar" (click)="eliminarAlmacen(almacen.id)">
                            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                        </ion-button>
                    </div>
                </div>

                <div *ngIf="!cargandoLista && listaAlmacenes.length === 0" class="empty-state">
                    <ion-icon name="archive-outline"></ion-icon>
                    <p>No hay almacenes registrados.</p>
                </div>
            </ion-content>
        </ng-template>
    </ion-modal>

</ion-content>
