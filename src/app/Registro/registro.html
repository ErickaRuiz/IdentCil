<div class="login-wrapper">
  <div class="card-container">
    <div class="logo-container">
      <img src="./assets/icon/logo.png" alt="Logo de la aplicación" class="logo-img" />
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="login-form">
      <h2>Crear Cuenta</h2>

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="Tu nombre" />
      </div>

      <div class="form-group">
  <label for="genero">Género</label>
  <select id="genero" formControlName="genero">
    <option value="" disabled selected>Selecciona tu género</option>
    <option value="Femenino">Femenino</option>
    <option value="Masculino">Masculino</option>
  </select>
</div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="identcil@gmail.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" />
      </div>

      <button type="submit" [disabled]="registroForm.invalid" class="btn-submit">
        Registrarse
      </button>

      <div class="inicio-link">
        <p>¿Ya tienes una cuenta? <a (click)="goToLogin()">Inicia sesión</a></p>
      </div>
    </form>
  </div>
</div>
