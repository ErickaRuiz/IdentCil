<div class="login-wrapper">
  <div class="card-container">
    <div class="logo-container">
      <img src="./assets/icon/logo.png" alt="Logo de la aplicación" class="logo-img" />
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <h2>Iniciar Sesión</h2>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="identcil@gmail.com" />
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-msg">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" />
        <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-msg">
          La contraseña debe tener al menos 8 caracteres.
        </span>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">
        Ingresar
      </button>

      <div class="register-link">
        <p>¿No tienes una cuenta? <a (click)="goToRegister()">Regístrate</a></p>
      </div>

    </form>
  </div>
</div>
