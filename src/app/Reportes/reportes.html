<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Reportes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Generación de Reportes</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        <ion-item button>
          <ion-label>
            <h2>Reporte de Cilindros</h2>
            <p>Estado e inventario general</p>
          </ion-label>
        </ion-item>
        <ion-item button>
          <ion-label>
            <h2>Reporte de Movimientos</h2>
            <p>Historial de salidas y devoluciones</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
